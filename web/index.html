    <script>
      // Đặt theme trước khi React chạy để không bị nháy màu
      try {
        var t = localStorage.getItem('taskflow-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#edf1f7');
        var a = localStorage.getItem('taskflow-accent');
        if (a && /^[a-z]+$/.test(a)) document.documentElement.dataset.accent = a;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
