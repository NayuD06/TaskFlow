<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow: quản lý dự án và công việc miễn phí với bảng Kanban kéo thả, lịch hạn chót và bể nước tiến độ." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TaskFlow · Quản lý dự án và công việc" />
    <meta property="og:description" content="Kéo thả công việc, theo dõi hạn chót và nhìn tiến độ dâng lên như mực nước. Miễn phí, dùng tốt trên điện thoại." />
    <meta name="theme-color" content="#04060b" />
    <script>
      // Đặt theme trước khi React chạy để không bị nháy màu
      try {
        var t = localStorage.getItem('taskflow-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#edf1f7');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TaskFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
